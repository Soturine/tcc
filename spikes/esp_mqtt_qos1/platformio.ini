; Spike P2 — ESP-MQTT (QoS 1 real) versus PubSubClient (QoS 0) no mesmo framework
; fixado do firmware. Os dois ambientes compartilham o mesmo sketch e diferem
; apenas pela biblioteca, para medir custo de memoria e provar compatibilidade de API.
; Execucao em hardware/broker real: preencher SPIKE_* via PLATFORMIO_BUILD_FLAGS.

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17

[env:pubsub]
lib_deps =
  knolleary/PubSubClient@2.8.0
build_flags =
  ${env.build_flags}
  -DSPIKE_ESP_MQTT=0

; Mesma biblioteca do firmware, com TLS (WiFiClientSecure/mbedTLS) como o produto.
[env:pubsub_tls]
lib_deps =
  knolleary/PubSubClient@2.8.0
build_flags =
  ${env.build_flags}
  -DSPIKE_ESP_MQTT=0
  -DSPIKE_TLS=1

[env:espmqtt]
build_flags =
  ${env.build_flags}
  -DSPIKE_ESP_MQTT=1
