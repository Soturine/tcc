# Perfil STAGING SEGURO (F-17/F-27). Sintaxe verificada contra Mosquitto 2.1.2
# (eclipse-mosquitto@sha256:38c0da4f...) por infra/mqtt/run-security-verification.sh.
#
# - Sem listener em texto puro: somente TLS em 8883 (nao ha fallback para 1883).
# - Sem acesso anonimo; credencial individual por device e principal backend separado.
# - ACL de menor privilegio (mosquitto-acl.example); o resto e negado.
# - Retained desabilitado: nenhum ACK/resultado/evento pode ficar "plantado" no broker.
# - per_listener_settings NAO e usado (legado na linha 2.1); opcoes abaixo sao globais.
#
# Certificados, chave, password_file e acl_file sao montados fora do Git.
# Este perfil e de referencia: staging real ainda NAO foi implantado/testado.

listener 8883 0.0.0.0
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

retain_available false
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
