# Perfil autenticado de referencia. Em ambiente externo, use o listener TLS
# (8883, certfile/keyfile/cafile) e nao exponha 1883. O password_file e gerado
# fora do Git com `mosquitto_passwd`; nenhuma credencial e versionada.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
