name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: queda_monitor
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify consistent project development version
        run: node scripts/check-version-consistency.mjs

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend checks
        working-directory: backend
        run: |
          npm run check
          npm test
          npm run test:integration
          npm run test:mqtt
          npm run stress:dry

      - name: Initialize disposable MySQL database
        working-directory: backend
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: ""
          MYSQL_DATABASE: queda_monitor
        run: |
          cp .env.example .env
          npm run db:init

      - name: Validate versioned migrations and event identity
        working-directory: backend
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: ""
          MYSQL_DATABASE: queda_monitor
          MYSQL_INTEGRATION: "1"
        run: |
          npm run db:migrate
          npm run db:audit:event-identity
          npm run test:mysql:migrations
          npm run test:mysql:retention
          npm run test:mysql:sessions

      # Mosquitto 2.1.2 fixado por digest (2026-09-17); per_listener_settings e legado nessa linha.
      - name: Start Mosquitto integration broker
        run: >-
          docker run --detach --name mosquitto-ci --publish 1883:1883
          --volume "${GITHUB_WORKSPACE}/infra/mqtt/mosquitto-ci.conf:/mosquitto/config/mosquitto.conf:ro"
          eclipse-mosquitto:2@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408

      - name: Run real MySQL and Mosquitto smoke
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 4000
          JWT_SECRET: ci-local-only-not-for-staging
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: ""
          MYSQL_DATABASE: queda_monitor
          MQTT_BROKER_URL: mqtt://127.0.0.1:1883
          MQTT_CLIENT_ID: queda-backend-ci
          MQTT_TOPIC_BASE: queda/devices
          ALERT_DELIVERY_DRY_RUN: "true"
        run: |
          # node direto: matar "npm start" deixaria o processo node orfao assinando o broker.
          node src/server.js > backend-ci.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat backend-ci.log
            exit 1
          fi

          npm run mqtt:test -- 127.0.0.1 1883
          npm run stress:real

          if grep --quiet '"level":"error"' backend-ci.log; then
            cat backend-ci.log
            exit 1
          fi

      - name: Run critical delivery failure scenarios (virtual device emulation)
        working-directory: backend
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: ""
          MYSQL_DATABASE: queda_monitor
          MQTT_BROKER_URL: mqtt://127.0.0.1:1883
          MQTT_TOPIC_BASE: queda/devices
          E2E_BACKEND_PORT: 4100
          # Habilita os cenarios de banco congelado (docker pause) e broker parado
          # (docker stop/start); sem eles os cenarios 7 e 18 seriam skipped.
          E2E_DB_CONTAINER: ${{ job.services.mysql.id }}
          E2E_BROKER_CONTAINER: mosquitto-ci
        run: |
          npm run test:e2e:critical
          # Nenhum cenario pode ser silenciosamente pulado no CI.
          report=$(ls -t logs/e2e/critical-delivery-*.json | head -1)
          node -e "const r=require('./'+process.argv[1]);const s=r.scenarios.filter(x=>x.status!=='passed');if(s.length){console.error(JSON.stringify(s,null,2));process.exit(1)}" "$report"

      - name: Verify staging MQTT profile against real Mosquitto (TLS, auth, ACL, retained, revocation)
        # CA/certificados/senhas efemeros; relatorio sanitizado em backend/logs/security.
        timeout-minutes: 5
        run: bash infra/mqtt/run-security-verification.sh
