name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/android/gradle/libs.versions.toml
            apps/android/gradle/wrapper/gradle-wrapper.properties

      - name: Production forbids cleartext (only the debug source set may allow emulator/loopback)
        run: |
          set -e
          main=app/src/main/res/xml/network_security_config.xml
          grep -q 'cleartextTrafficPermitted="false"' "$main"
          if grep -q 'cleartextTrafficPermitted="true"' "$main"; then echo "cleartext permitido em main"; exit 1; fi
          if grep -q 'usesCleartextTraffic="true"' app/src/main/AndroidManifest.xml; then echo "usesCleartextTraffic em main"; exit 1; fi
          debug=app/src/debug/res/xml/network_security_config.xml
          allowed=$(grep -o '<domain[^>]*>[^<]*</domain>' "$debug" | sed -E 's/<[^>]+>//g' | sort | tr '\n' ' ')
          test "$allowed" = "10.0.2.2 127.0.0.1 localhost " || { echo "dominios cleartext de debug inesperados: $allowed"; exit 1; }
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml

      - name: Build debug, Android lint and JVM tests (unit, ViewModel, Compose UI via Robolectric)
        run: ./gradlew --no-daemon --stacktrace assembleDebug lintDebug testDebugUnitTest

      - name: Release build compiles with minification (no API URL => app shows "not configured")
        run: ./gradlew --no-daemon assembleRelease

      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          if-no-files-found: warn

      - name: Debug APK (only when every previous step passed)
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  live-integration:
    # Cliente Kotlin real x backend Node + MySQL reais (seed sintetico). Sem emulador.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: queda_monitor
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_DATABASE: queda_monitor
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/android/gradle/libs.versions.toml
            apps/android/gradle/wrapper/gradle-wrapper.properties

      - name: Prepare disposable database (schema, seed, migrations)
        working-directory: backend
        run: |
          npm ci
          cp .env.example .env
          npm run db:init
          npm run db:migrate

      - name: Live Android client against the real backend
        run: |
          cd backend
          NODE_ENV=test PORT=4400 JWT_SECRET=ci-android-live-only MQTT_BROKER_URL=mqtt://127.0.0.1:1 \
            ALERT_DELIVERY_DRY_RUN=true node src/server.js > backend-android-live.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4400/health >/dev/null && break; sleep 1; done
          cd ../apps/android
          QUEDA_LIVE_API_URL=http://127.0.0.1:4400 ./gradlew --no-daemon testDebugUnitTest --tests "*LiveBackendTest*"
          # O teste e SKIPPED sem a variavel; aqui ele precisa ter rodado de fato.
          report=app/build/test-results/testDebugUnitTest/TEST-br.tcc.quedamonitor.live.LiveBackendTest.xml
          grep -q 'tests="1" skipped="0" failures="0" errors="0"' "$report" || { cat "$report"; exit 1; }
