name: Firmware

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Build ESP32 firmware
        run: platformio run -e esp32dev

      - name: Run native detector and critical delivery tests
        run: platformio test -e native

      - name: Build ESP-MQTT QoS 1 spike (ADR-020 evidence)
        run: platformio run -d spikes/esp_mqtt_qos1

  research-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build offline replay from firmware detector sources
        run: bash tools/research/build_replay.sh

      - name: Run research infrastructure tests (synthetic fixtures only)
        working-directory: tools/research
        env:
          FALLBENCH_REQUIRE_REPLAY: "1"
        run: python -m unittest discover -s tests -v

      - name: Verify committed synthetic fixtures are reproducible
        run: |
          python tools/research/fixtures/make_synthetic.py
          git diff --exit-code -- tools/research/fixtures/synthetic

      - name: Run MotionLab offline foundation tests (synthetic only, isolated from SOS/outbox)
        run: python -m unittest discover -s tools/motionlab/tests -v

      - name: Verify committed Nyquist synthetic artifact is reproducible (4+17 Hz @ 125 Hz)
        working-directory: tools/research
        run: |
          python -m fallbench nyquist-synthetic --out fixtures/nyquist/synthetic_4hz_17hz_125hz.json
          git diff --exit-code -- fixtures/nyquist
